<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Princess Day Card Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&amp;family=Nunito:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1f6;--card:#ffffff;--ink:#4a1d33;--soft:#8a5a70;--pink:#ec5c9a;--line:#f6c9dc;--gold:#d9a441;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2a1020;--card:#3a1a2c;--ink:#ffe6f1;--soft:#d9a3bd;--pink:#ff7db5;--line:#6a3552;--gold:#e8b95a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1020;--card:#3a1a2c;--ink:#ffe6f1;--soft:#d9a3bd;--pink:#ff7db5;--line:#6a3552;--gold:#e8b95a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 48px}
h1,h2{font-family:'Pacifico',cursive;font-weight:400;color:var(--pink);margin:.2em 0 .4em}
h1{font-size:2rem;text-align:center}h2{font-size:1.5rem}
.tag{text-align:center;color:var(--soft);margin-bottom:20px}
label{display:block;font-weight:700;margin:14px 0 4px}
input[type=text],textarea{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ph{aspect-ratio:3/4;border:2px dashed var(--pink);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.85rem;color:var(--soft);cursor:pointer;background-size:cover;background-position:center;position:relative;overflow:hidden}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
button{font:inherit;font-weight:700;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:13px 22px;cursor:pointer}
button.ghost{background:transparent;color:var(--pink);border:2px solid var(--pink)}
.row{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.hide{display:none}
.hero{text-align:center;padding:36px 10px}
.hero .big{font-size:2.4rem;margin:.2em 0}
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 28px}
.flip{aspect-ratio:3/4;perspective:700px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;overflow:hidden;border:4px solid var(--card);box-shadow:0 4px 14px rgba(236,92,154,.25)}
.f{background:var(--line) center/cover}
.b{transform:rotateY(180deg);background:var(--card);display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:.8rem;color:var(--ink)}
.cert{background:var(--card);border:4px double var(--gold);border-radius:14px;padding:24px 18px;text-align:center;position:relative}
.cert small{letter-spacing:.2em;color:var(--soft)}
.cert .nm{font-family:'Pacifico',cursive;font-size:1.9rem;color:var(--pink);margin:6px 0}
.cert ul{text-align:left;padding-left:20px;margin:12px 0}
.cert li{margin:6px 0}
.sign{display:flex;justify-content:space-between;margin-top:18px;font-size:.9rem;color:var(--soft)}
.seal{position:absolute;top:-14px;right:-8px;background:var(--gold);color:#fff;font-size:.65rem;font-weight:700;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(12deg)}
.note{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;margin-top:28px;white-space:pre-wrap}
.hint{font-size:.85rem;color:var(--soft);text-align:center;margin-top:14px}
.sm{font-size:.85rem;margin-top:6px}
.err{color:#d33;text-align:center;margin-top:10px;font-weight:700}
</style>
</head>

<script>
(function(){
var DEF="Chief Banter Officer. Meri fun banter ki poori zimmedari. Hamesha. Koi off day nahi.\nHamesha mere saath. Replies, rants, raat ke 2 baje ke random thoughts. Sab covered.\nMere jokes pe hasna. Bure wale pe bhi. Khaas kar bure wale pe.\nSnack policy. Achhi fries share karna. Koi exception nahi.\nTerms: hamesha ke liye valid, non-refundable, non-transferable.";
var S=null;try{S=JSON.parse(document.getElementById('state').textContent)}catch(e){}
var app=document.getElementById('app');
var D=S||{me:'',her:'',msg:'',duties:DEF,photos:[null,null,null],backs:['ye wala din mera favourite hai ♥','tum hasti ho to sab theek lagta hai','mera favourite insaan, hamesha ✿']};
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function $(i){return document.getElementById(i)}

function compress(file,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8));
  };im.src=r.result};r.readAsDataURL(file);
}

function editor(){
  app.innerHTML='<h1>✿ Princess Day Card ✿</h1><p class="tag">Naam, photos aur message bharo, phir card file download karo.</p>'+
  '<label>Aapka naam</label><input type="text" id="me" value="'+esc(D.me).replace(/"/g,'&quot;')+'">'+
  '<label>Uska naam</label><input type="text" id="her" value="'+esc(D.her).replace(/"/g,'&quot;')+'">'+
  '<label>3 photos (tap karke chuno)</label><div class="photos">'+[0,1,2].map(function(i){return '<div class="ph" id="p'+i+'">+ photo '+(i+1)+'<input type="file" accept="image/*"></div>'}).join('')+'</div>'+
  [0,1,2].map(function(i){return '<input type="text" class="sm" id="b'+i+'" placeholder="photo '+(i+1)+' ke peeche kya likha ho" value="'+esc(D.backs[i]).replace(/"/g,'&quot;')+'" style="margin-top:6px">'}).join('')+
  '<label>Aapka message</label><textarea id="msg">'+esc(D.msg)+'</textarea>'+
  '<label>Princess ki duties (har line ek duty)</label><textarea id="duties" style="min-height:140px">'+esc(D.duties)+'</textarea>'+
  '<div class="row"><button id="save">Card file banao ♥</button></div><div id="st" class="err"></div>';
  [0,1,2].forEach(function(i){
    var box=$('p'+i);
    if(D.photos[i]){box.style.backgroundImage='url('+D.photos[i]+')';box.firstChild.textContent=''}
    box.querySelector('input').onchange=function(e){var f=e.target.files[0];if(!f)return;
      compress(f,function(u){D.photos[i]=u;box.style.backgroundImage='url('+u+')';box.firstChild.textContent=''})};
  });
  $('save').onclick=save;
}

function card(){
  var lines=D.duties.split('\n').filter(function(x){return x.trim()});
  var dl=lines.map(function(l){var k=l.indexOf('. ');return k>0&&k<40?'<li><b>'+esc(l.slice(0,k+1))+'</b> '+esc(l.slice(k+2))+'</li>':'<li>'+esc(l)+'</li>'}).join('');
  var wall=[0,1,2].map(function(i){return '<div class="flip"><div class="in"><div class="f"'+(D.photos[i]?' style="background-image:url('+D.photos[i]+')"':'')+'></div><div class="b">'+esc(D.backs[i])+'</div></div></div>'}).join('');
  var her=esc(D.her||'Princess'),me=esc(D.me||'Me');
  app.innerHTML='<div class="hero"><div>happy princess day</div><h1 class="big">Hey '+her+'!</h1><p>Maine tumhare liye ek chhoti si cheez banayi hai... ✿</p></div>'+
  '<h2>the memory wall</h2><p class="tag" style="text-align:left;margin-top:-6px">ek photo palto, peeche kuch likha hai ✿</p><div class="wall">'+wall+'</div>'+
  '<h2>the princess certificate</h2><div class="cert"><div class="seal">OFFICIAL SEAL</div><small>CERTIFICATE OF PRINCESSHOOD</small><p>Ye certify karta hai ki</p><div class="nm">'+her+'</div><p>officially ek aur sirf ek princess hai, in lifelong duties ke saath:</p><ul>'+dl+'</ul><div class="sign"><span>issued by<br><b>'+me+'</b></span><span>official witness<br><b>the cat 🐱</b></span></div></div>'+
  '<h2 style="margin-top:28px">a note for you</h2><div class="note">'+esc(D.msg||('Tum meri life ki sabse achhi cheez ho. Happy Princess Day ♥ — '+(D.me||'')))+'</div><div class="row" id="slot"></div>';
  app.querySelectorAll('.flip').forEach(function(f){f.onclick=function(){f.classList.toggle('on')}});
}

function toEdit(){editor()}
function showOwnerBtn(){var s=$('slot');if(s&&!$('ed')){var b=document.createElement('button');b.id='ed';b.className='ghost';b.textContent='✎ Edit karo';b.onclick=toEdit;s.appendChild(b)}}

async function save(){
  var st=$('st');st.textContent='';
  D.me=$('me').value.trim();D.her=$('her').value.trim();D.msg=$('msg').value.trim();D.duties=$('duties').value;
  D.backs=[0,1,2].map(function(i){return $('b'+i).value.trim()});
  if(!D.her){st.textContent='Uska naam daalo pehle.';return}
  $('save').disabled=true;$('save').textContent='Save ho raha hai...';
  try{
    var cl=document.documentElement.cloneNode(true);
    cl.querySelector('#app').innerHTML='';
    cl.querySelector('#state').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
    var html='<!DOCTYPE html>\n'+cl.outerHTML;
    var url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    var l=document.createElement('a');l.href=url;l.download='card.html';document.body.appendChild(l);l.click();l.remove();
    $('save').disabled=false;$('save').textContent='Dobara download karo';
    st.style.color='#2a8a4a';st.textContent='✓ card.html download ho gayi. Ab ise hosting par upload karo.';
  }catch(e){
    $('save').disabled=false;$('save').textContent='Card file banao ♥';
    st.textContent='Download nahi hua. Computer ke Chrome me try karo.';
  }
}

if(S){card()}else{editor()}
})();
</script>
